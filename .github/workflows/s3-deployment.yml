name: S3 Deployment with GitHub Actions React App

on:
  push:
    branches: [main]

jobs:

    deployment:
        name: s3 react app deployment
        runs-on: ubuntu-latest
    
        steps:
            - name: Checkout 
              uses: actions/checkout@v4
        
            - name: Setup Node.js
              uses: actions/setup-node@v4  
              with:
                    node-version: 24
                    cache: npm
        
            - name: Install Dependencies
              run: npm install
            
            - name: Make Build
              run: npm run build
            
            - name: Configure AWS S3 credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-access-key-id: ${{secrets.ACCESS_KEY}}
                aws-secret-access-key: ${{secrets.SECRET_KEY}}
                aws-region: ${{secrets.AWS_REGION}}
            
            - name: Upload to S3
              run: aws s3 sync . s3://${{secrets.AWS_BUCKET}} --delete \ --exclude *.git/** --exclude *.github/**
                
         

        
        